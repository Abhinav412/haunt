[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "haunt"
version = "0.1.0"
description = "A ghost in the repo: git hooks + a local open-weight model that whispers eerie commentary on commits and files."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
]

[project.scripts]
haunt = "haunt.cli:app"

[tool.setuptools.packages.find]
include = ["haunt*"]

[tool.setuptools.package-data]
haunt = ["personas/*.toml", "hooks/post-commit.template.sh"]
